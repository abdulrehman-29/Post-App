<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - PostApp</title>
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-color: #f3f6f9;
      --card-bg: #ffffff;
      --primary: #5c85d6;
      --primary-hover: #4a72c2;
      --text-main: #334155;
      --text-muted: #94a3b8;
      --input-bg: #fafbfc;
      --border-color: #e2e8f0;
      --shadow: 0 12px 28px rgba(148, 163, 184, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 2rem;
    }

    /* Navbar */
    .navbar {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(148, 163, 184, 0.08);
    }

    .nav-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-actions i {
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-actions i:hover {
      color: var(--primary);
    }

    .btn-logout {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background-color: #fef2f2;
      color: #ef4444;
      border-color: #fca5a5;
    }

    /* Layout */
    .main-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Create Post Card */
    .create-post-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }

    .create-post-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 1.1rem;
    }

    .post-input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--input-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      resize: none;
      min-height: 80px;
      transition: border-color 0.2s;
    }

    .post-input:focus {
      border-color: var(--primary);
      background-color: #ffffff;
    }

    .create-post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
    }

    .post-options {
      display: flex;
      gap: 1.25rem;
    }

    .post-option-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s;
    }

    .post-option-btn:hover {
      color: var(--primary);
    }

    .btn-post {
      padding: 0.5rem 1.25rem;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-post:hover {
      background-color: var(--primary-hover);
    }

    /* Post Feed Card */
    .post-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .post-time {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .post-content {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    .post-image {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 1rem;
    }

    .post-actions {
      display: flex;
      justify-content: space-around;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background-color: var(--input-bg);
      color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#" class="logo">
        <i class="fa-solid fa-layer-group"></i> PostApp
      </a>
      <div class="nav-actions">
        <i class="fa-solid fa-house"></i>
        <i class="fa-regular fa-bell"></i>
        <i class="fa-regular fa-user"></i>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Feed Area -->
  <div class="main-container">

    <!-- Create Post Section -->
    <div class="create-post-card">
      <div class="create-post-header">
        <div class="avatar">
          <i class="fa-solid fa-user"></i>
        </div>
        <textarea id="postInput" class="post-input" placeholder="What's on your mind?"></textarea>
      </div>
      <div class="create-post-footer">
        <div class="post-options">
          <button class="post-option-btn"><i class="fa-regular fa-image"></i> Photo</button>
          <button class="post-option-btn"><i class="fa-solid fa-link"></i> Link</button>
        </div>
        <button class="btn-post" id="postBtn">Post</button>
      </div>
    </div>

    <!-- Feed Posts Container -->
    <div id="feedContainer">
      
      <!-- Sample Post Card -->
      <div class="post-card">
        <div class="post-header">
          <div class="user-info">
            <div class="avatar">
              <i class="fa-solid fa-user"></i>
            </div>
            <div>
              <div class="user-name">John Doe</div>
              <div class="post-time">2 hours ago</div>
            </div>
          </div>
          <i class="fa-solid fa-ellipsis" style="color: var(--text-muted); cursor: pointer;"></i>
        </div>
        <div class="post-content">
          Just launched a new project! Built completely using clean light themes and modern web technologies. What do you all think?
        </div>
        <div class="post-actions">
          <button class="action-btn"><i class="fa-regular fa-heart"></i> Like</button>
          <button class="action-btn"><i class="fa-regular fa-comment"></i> Comment</button>
          <button class="action-btn"><i class="fa-regular fa-paper-plane"></i> Share</button>
        </div>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="home.js"></script>
</body>
</html>
