<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - PostApp</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-color: #f3f6f9;
      --card-bg: #ffffff;
      --primary: #5c85d6;
      --primary-hover: #4a72c2;
      --danger: #ef4444;
      --text-main: #334155;
      --text-muted: #94a3b8;
      --input-bg: #fafbfc;
      --border-color: #e2e8f0;
      --shadow: 0 12px 28px rgba(148, 163, 184, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 2rem;
    }

    /* Navbar */
    .navbar {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(148, 163, 184, 0.08);
    }

    .nav-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-actions i {
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-logout {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-logout:hover {
      background-color: #fef2f2;
      color: var(--danger);
      border-color: #fca5a5;
    }

    /* Layout */
    .main-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Create Post Card */
    .create-post-card, .post-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }

    .create-post-header {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .post-inputs-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .title-input, .post-input {
      width: 100%;
      padding: 0.6rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .title-input { font-weight: 600; }
    .post-input { resize: none; min-height: 80px; }

    .title-input:focus, .post-input:focus {
      border-color: var(--primary);
      background-color: #ffffff;
    }

    .create-post-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
    }

    .btn-post {
      padding: 0.5rem 1.25rem;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-post:hover { background-color: var(--primary-hover); }

    /* Post Feed Card */
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-name { font-size: 0.95rem; font-weight: 600; }
    .post-time { font-size: 0.78rem; color: var(--text-muted); }

    .post-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .post-content {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #475569;
      margin-bottom: 1rem;
      white-space: pre-line;
    }

    .post-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
    }

    .action-btn.edit-btn:hover { background-color: #e2e8f0; color: var(--primary); }
    .action-btn.delete-btn:hover { background-color: #fee2e2; color: var(--danger); border-color: #fca5a5; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#" class="logo">
        <i class="fa-solid fa-layer-group"></i> PostApp
      </a>
      <div class="nav-actions">
        <!-- <i class="fa-solid fa-house" title="Home"></i>
        <i class="fa-regular fa-bell" title="Notifications"></i>
        <i class="fa-regular fa-user" title="Profile"></i> -->
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Feed Area -->
  <div class="main-container">

    <!-- Create Post Section -->
    <div class="create-post-card">
      <div class="create-post-header">
        <div class="avatar"><i class="fa-solid fa-user"></i></div>
        <div class="post-inputs-wrapper">
          <input type="text" id="postTitle" class="title-input" placeholder="Post Title (Min 3 letters)...">
          <textarea id="postInput" class="post-input" placeholder="What's on your mind? (Min 10 letters)..."></textarea>
        </div>
      </div>
      <div class="create-post-footer">
        <button class="btn-post" id="postBtn">Post</button>
      </div>
    </div>

    <!-- Feed Posts Container -->
    <div id="feedContainer"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="home.js"></script>
</body>
</html>
